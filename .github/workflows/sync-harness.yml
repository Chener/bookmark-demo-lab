name: Ballot KV-to-git sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rotate-beat harness
        run: |
          git config user.name "muse-bot"
          git config user.email "muse-bot@chenerpath.com"
          python3 scripts/rotate-beat.py
